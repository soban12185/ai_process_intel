services:
  - type: web
    name: novabank-ai-api
    runtime: python
    pythonVersion: 3.12.7
    buildCommand: pip install -r requirements.txt && python seed/seed.py
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: RESEARCH_ENABLED
        value: true
